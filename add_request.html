{% extends "base.html" %}
{% block content %}
<div class="form-card">
    <h1>Create Service Request</h1>
    {% if not customers or not services %}
        <div class="message error">Add at least one customer and one service before creating a request.</div>
    {% endif %}
    <form method="POST">
        <div class="form-group">
            <label>Customer *</label>
            <select name="customer_id" required>
                <option value="">Select customer</option>
                {% for customer in customers %}
                    <option value="{{ customer.id }}">{{ customer.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Service *</label>
            <select name="service_id" required>
                <option value="">Select service</option>
                {% for service in services %}
                    <option value="{{ service.id }}">{{ service.service_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group"><label>Request Date *</label><input type="date" name="request_date" required></div>
        <div class="form-group">
            <label>Status *</label>
            <select name="status">
                <option>Pending</option>
                <option>In Progress</option>
                <option>Completed</option>
                <option>Cancelled</option>
            </select>
        </div>
        <button class="btn" type="submit" {% if not customers or not services %}disabled{% endif %}>Create Request</button>
        <a href="{{ url_for('service_requests') }}" class="btn secondary">Cancel</a>
    </form>
</div>
{% endblock %}
