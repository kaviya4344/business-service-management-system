{% extends "base.html" %}
{% block content %}
<div class="form-card">
    <h1>Add New Customer</h1>
    <form method="POST">
        <div class="form-group"><label>Name *</label><input name="name" required></div>
        <div class="form-group"><label>Email *</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Phone *</label><input name="phone" required></div>
        <div class="form-group"><label>Address</label><textarea name="address" rows="4"></textarea></div>
        <button class="btn" type="submit">Add Customer</button>
        <a href="{{ url_for('customers') }}" class="btn secondary">Cancel</a>
    </form>
</div>
{% endblock %}
