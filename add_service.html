{% extends "base.html" %}
{% block content %}
<div class="form-card">
    <h1>Add New Service</h1>
    <form method="POST">
        <div class="form-group"><label>Service Name *</label><input name="service_name" required></div>
        <div class="form-group"><label>Description</label><textarea name="description" rows="4"></textarea></div>
        <div class="form-group"><label>Price *</label><input type="number" step="0.01" min="0" name="price" required></div>
        <button class="btn" type="submit">Add Service</button>
        <a href="{{ url_for('services') }}" class="btn secondary">Cancel</a>
    </form>
</div>
{% endblock %}
